name: Deploy VPS

# /docker/gestaoti na VPS já é um clone git (setup feito manualmente, ver
# PR #51). Este workflow só dá fetch/reset — não clona do zero.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /docker/gestaoti
            git fetch origin master
            git reset --hard origin/master
            docker compose build
            docker compose up -d
            sleep 5
            curl -f http://127.0.0.1:3000/api/health
