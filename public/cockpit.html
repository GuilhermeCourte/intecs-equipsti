<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Aplica o tema antes da pintura (evita o flash). Chave própria, separada
       da do app: o tema aqui é propriedade da TELA onde o painel está pendurado,
       não do usuário — e o padrão precisa ser escuro, não o claro do admin. -->
  <script>
    (function () {
      try {
        var modo = localStorage.getItem('tema-cockpit') === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', modo);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d10">
  <title>GTI · Cockpit</title>
  <link rel="icon" type="image/png" href="favicon_intecs.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    /* ============================================================
       Cockpit — painel de parede.
       Tema escuro fixo (não segue o toggle do app): a tela fica ligada
       o dia inteiro e o claro cansa. Grade de 100vh sem rolagem — o que
       não couber tem que ser cortado por regra, não empurrado para baixo
       de uma dobra que ninguém vai rolar.
       ============================================================ */
    /* Escuro é o padrão (tela ligada o dia todo), mas o claro existe para
       quando o cockpit vive num monitor de mesa em sala clara. */
    :root {
      --bg:        #0d0d10;
      --surface:   #16161b;
      --line:      #26262e;
      --ink:       #f2f2f5;
      --ink-2:     #b9b9c4;
      --muted:     #6e6e7c;
      --chip:      #21212a;
      --campo:     #1e1e25;
      --alerta-bg: rgba(240,71,93,.12);
      --verde:     #22c55e;
      --vermelho:  #f0475d;
      --laranja:   #ff8c42;
      --azul:      #5b8cff;
      --radius:    16px;
    }
    html[data-theme="light"] {
      --bg:        #f1f1f4;
      --surface:   #ffffff;
      --line:      #e3e3e9;
      --ink:       #16161a;
      --ink-2:     #45454f;
      --muted:     #8a8a95;
      --chip:      #f0f0f4;
      --campo:     #f7f7fa;
      --alerta-bg: rgba(220,38,38,.07);
      --verde:     #16a34a;
      --vermelho:  #dc2626;
      --laranja:   #e07016;
      --azul:      #3b6fe0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Poppins, system-ui, sans-serif;
      overflow: hidden;                 /* painel fixo: nunca rola */
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Grade ---------- */
    .cp {
      height: 100vh;
      height: 100dvh;
      display: grid;
      /* Unidades e chamados agora são linhas inteiras, uma embaixo da outra.
         Toda linha fica do tamanho do conteúdo e a sobra de altura vai pro fim
         da tela (align-content: start) — nada de vão entre um card e outro.
         Chamados é minmax(0, auto): não cresce além do conteúdo, mas pode
         encolher numa tela baixa em vez de empurrar o resto pra fora (aí as
         listas dele rolam por dentro, ver #blocoChamados). */
      grid-template-rows: auto auto minmax(0, auto) auto;
      align-content: start;
      gap: 10px;
      padding: 12px 18px 14px;
    }
    /* stretch (padrão): avisos e eventos sempre do mesmo tamanho — o mais alto
       dos dois define a altura da linha, e o outro estica pra acompanhar. */
    .cp-linha { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
    .cp-bloco {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex; flex-direction: column;
      min-height: 0; min-width: 0;
    }
    #blocoUnidades .cp-corpo { flex: none; overflow: visible; }
    /* Numa tela baixa o max-height segura o card dentro da linha (que pode
       encolher) e as listas rolam por dentro em vez de vazar. */
    #blocoChamados { max-height: 100%; }
    /* Corpo dos chamados é a parte elástica do card: nada pode vazar pra fora. */
    #blocoChamados .cp-corpo { display: flex; flex-direction: column; min-height: 0; }
    #blocoUnidades { padding: 8px 20px; }
    #blocoUnidades .cp-bloco-tit { margin-bottom: 2px; min-height: 0; }
    .oculto { display: none !important; }   /* vale para o rodapé também */
    /* Quando um bloco some por falta de permissão, o irmão ocupa a linha. */
    .cp-linha:has(> .cp-bloco.oculto) { grid-template-columns: 1fr; }

    .cp-bloco-tit {
      display: flex; align-items: center; gap: .5rem;
      font-size: .78rem; font-weight: 700; letter-spacing: 1.4px;
      color: var(--muted); text-transform: uppercase;
      margin-bottom: 12px; flex-shrink: 0;
    }
    /* O nome do card virou o alvo do atalho: inline-flex para o clique terminar
       no fim do texto, mantendo o mesmo gap que o flex do cabeçalho dava. */
    .cp-bloco-tit [data-app] { display: inline-flex; align-items: center; gap: .5rem; }
    .cp-bloco-tit .cp-carimbo {
      margin-left: auto; letter-spacing: 0; text-transform: none;
      font-weight: 500; font-size: .72rem;
    }
    .cp-corpo { flex: 1; min-height: 0; overflow: hidden; }
    .cp-mes-nav { margin-left: auto; display: flex; align-items: center; gap: .1rem; }
    .cp-mes-nav .cp-carimbo { margin-left: 0; min-width: 84px; text-align: center; user-select: none; }
    .cp-mes-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px;
      background: transparent; color: var(--muted); font-size: .9rem; line-height: 1;
      transition: background .15s, color .15s;
    }
    .cp-mes-btn:hover { background: var(--chip); color: var(--ink); }

    /* ---------- Cabeçalho ---------- */
    .cp-topo {
      display: flex; align-items: center; gap: 1rem;
      padding: 0 4px;
    }
    .cp-marca {
      font-size: 1rem; font-weight: 800; letter-spacing: 2px;
      display: flex; align-items: center; gap: .55rem;
    }
    .cp-marca img { height: 26px; width: auto; }
    /* Insumos e emprestados: mudam devagar e não competem com unidades nem
       chamados. Vão no espaço morto do cabeçalho, em corpo pequeno de propósito. */
    .cp-mini { margin-left: auto; display: flex; align-items: center; gap: 1.3rem; }
    .cp-mini-item {
      display: flex; align-items: baseline; gap: .35rem;
      font-size: .74rem; font-weight: 600; letter-spacing: .6px;
      color: var(--muted); text-transform: uppercase;
    }
    .cp-mini-item i { font-size: .95rem; align-self: center; }
    .cp-mini-item b { font-size: 1.15rem; font-weight: 800; color: var(--ink-2); letter-spacing: -.5px; }
    .cp-mini-item.alerta b { color: var(--vermelho); }
    /* O item da VPS abre a aba dela: vira botão, mas mantém a cara dos vizinhos. */
    .cp-mini-botao {
      background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer;
      /* color: inherit é obrigatório — <button> não herda cor sozinho (o
         navegador força buttontext) e o ícone sumia no tema escuro. */
      color: inherit; border-radius: 6px; transition: color .15s;
    }
    .cp-mini-botao:hover { color: var(--ink-2); }
    .cp-mini-botao:hover b { color: var(--ink); }
    .cp-relogio {
      display: flex; align-items: center; gap: .8rem;
      padding-left: 1.3rem; border-left: 1px solid var(--line);
    }
    .cp-data { font-size: .9rem; color: var(--ink-2); font-weight: 500; }
    .cp-hora { font-size: 1.6rem; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
    .cp-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--chip); border: 1px solid var(--line); color: var(--ink-2);
      font-size: 1rem; cursor: pointer; transition: color .15s, border-color .15s;
    }
    .cp-btn:hover { color: var(--ink); border-color: var(--muted); }
    /* Som travado pelo navegador (autoplay policy): o painel precisa DIZER que
       está mudo, senão o alerta sonoro simplesmente não toca e ninguém sabe
       por quê. Um clique em qualquer lugar resolve. */
    .cp-btn.travado { color: var(--vermelho); border-color: var(--vermelho); }

    /* ---------- Unidades ---------- */
    /* O bloco inteiro acende quando alguma unidade cai: é o que se lê de longe. */
    #blocoUnidades.alerta {
      border-color: rgba(240,71,93,.5);
      background: linear-gradient(180deg, var(--alerta-bg), transparent 60%), var(--surface);
    }
    .cp-online {
      margin-top: auto; padding-top: 0; display: flex; align-items: center; flex-wrap: nowrap;
      font-size: 1rem; font-weight: 600; color: var(--ink-2);
    }
    .cp-online-lista {
      flex: 1; min-width: 0; display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 4px 10px;
      overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }
    .cp-online-lista::-webkit-scrollbar { height: 6px; }
    .cp-online-lista::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    .cp-online-lista::-webkit-scrollbar-track { background: transparent; }
    .cp-online-lista span { display: inline-flex; align-items: center; gap: .35rem; flex-shrink: 0; white-space: nowrap; }
    /* Unidade caiu ou está instável: pílula na cor do problema em volta do nome e a bola também. */
    .cp-online-lista span.down, .cp-online-lista span.instavel {
      padding: .2rem .6rem; border-radius: 999px; border: 1px solid;
    }
    .cp-online-lista span.down { background: var(--alerta-bg); border-color: var(--vermelho); color: var(--vermelho); }
    .cp-online-lista span.instavel { background: rgba(224,112,22,.1); border-color: var(--laranja); color: var(--laranja); }
    .cp-online-lista span.down .cp-ponto, .cp-online-lista span.instavel .cp-ponto { background: currentColor; }
    .cp-ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--verde); flex-shrink: 0; }

    /* ---------- Chamados ---------- */
    /* Linhas dos chamados (título + status), INTECS e MSA lado a lado.
       min-height: 0 até a lista pra que ela encolha e role quando a tela é
       baixa, em vez de empurrar o conteúdo pra fora do card. */
    .cp-chamados-listas {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    .cp-chamados-coluna { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .cp-chamados-rot {
      font-size: .72rem; font-weight: 700; letter-spacing: 1.6px;
      color: var(--muted); margin-bottom: 6px; flex-shrink: 0;
    }
    #blocoChamados .cp-lista { flex: 1; min-height: 0; }

    /* ---------- Listas (avisos + eventos) ---------- */
    /* Caixa do tamanho de 4 linhas (limitarAltura() no JS mede e aplica
       max-height); o resto rola por dentro. Barra fina para não poluir de longe. */
    #blocoAvisos .cp-corpo, #blocoEventos .cp-corpo { flex: none; overflow: visible; }
    .cp-lista {
      height: 100%; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; gap: 2px;
      scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }
    #blocoAvisos .cp-lista, #blocoEventos .cp-lista { height: auto; }
    .cp-lista::-webkit-scrollbar { width: 6px; }
    .cp-lista::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
    .cp-lista::-webkit-scrollbar-track { background: transparent; }
    /* Atalho para o app: de longe o painel tem que continuar idêntico, então o
       realce só existe com o ponteiro em cima — na parede não há ponteiro. */
    [data-app] { cursor: pointer; }
    @media (hover: hover) {
      [data-app]:hover { color: var(--azul); }
      .cp-li[data-app]:hover .cp-li-ico, .cp-li[data-app]:hover .cp-li-sub { color: inherit; }
    }
    .cp-li, .cp-divisor { flex-shrink: 0; }
    .cp-li {
      display: flex; align-items: flex-start; gap: .65rem;
      padding: .42rem 0; border-bottom: 1px solid var(--line);
      font-size: clamp(.82rem, 1.75vh, 1rem);
    }
    .cp-li:last-child { border-bottom: none; }
    .cp-li-quando {
      display: flex; flex-direction: column; gap: 1px;
      font-weight: 700; color: var(--muted); min-width: 54px; flex-shrink: 0; font-variant-numeric: tabular-nums;
    }
    .cp-li-quando small { font-weight: 500; font-size: .74em; opacity: .75; }
    .cp-li-ico { flex-shrink: 0; line-height: 1.3; color: var(--muted); }
    .cp-li.alerta .cp-li-ico { color: var(--vermelho); }
    .cp-li-corpo { flex: 1; min-width: 0; }
    .cp-li-tit { font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-li-sub { font-size: .8em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cp-li-val { font-weight: 700; color: var(--verde); flex-shrink: 0; font-size: .9em; }
    .cp-divisor {
      font-size: .62rem; font-weight: 700; letter-spacing: 1.4px; color: var(--muted);
      padding: .5rem 0 .2rem;
    }
    .cp-badge-venc {
      font-size: .58rem; font-weight: 800; letter-spacing: .5px;
      background: rgba(240,71,93,.18); color: var(--vermelho);
      padding: .1rem .38rem; border-radius: 4px; vertical-align: middle;
    }
    .cp-vazio {
      display: flex; align-items: center; justify-content: center; height: 100%;
      color: var(--muted); font-size: .9rem; gap: .5rem;
    }
    .cp-vazio i { font-size: 1.2rem; color: var(--verde); }
    .cp-dot-evt { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: .45em; }
    .cp-dot-evt.MENSAL  { background: var(--azul); }
    .cp-dot-evt.ANUAL   { background: var(--laranja); }
    .cp-dot-evt.NENHUMA { background: #6b7280; }

    /* ---------- Login (o JWT vence em 12h; sem isto a tela amanhece morta) ---------- */
    #cpLogin {
      position: fixed; inset: 0; z-index: 50; background: var(--bg);
      display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    #cpLogin.oculto { display: none; }
    .cp-login-card {
      width: 100%; max-width: 360px; background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 28px;
    }
    .cp-login-card h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: 1.5px; margin: 0 0 .3rem; }
    .cp-login-card p { color: var(--muted); font-size: .84rem; margin: 0 0 1.2rem; }
    .cp-login-card input {
      width: 100%; padding: .65rem .85rem; margin-bottom: .6rem;
      background: var(--campo); border: 1px solid var(--line); border-radius: 10px;
      color: var(--ink); font-family: inherit; font-size: .92rem;
    }
    .cp-login-card input:focus { outline: 2px solid var(--azul); outline-offset: -1px; }
    .cp-login-card button {
      width: 100%; padding: .68rem; margin-top: .4rem;
      background: var(--azul); color: #fff; border: 0; border-radius: 10px;
      font-family: inherit; font-weight: 700; font-size: .92rem; cursor: pointer;
    }
    .cp-login-card button:disabled { opacity: .6; cursor: default; }
    .cp-login-erro { color: var(--vermelho); font-size: .8rem; margin-top: .7rem; min-height: 1rem; }

    /* ---------- Aba VPS ---------- */
    /* O painel e a aba VPS dividem o MESMO cabeçalho: só o miolo troca. */
    #cpPainel { display: contents; }
    /* Na aba VPS a grade vira cabeçalho + unidades + um miolo que pega o resto. */
    .cp.vps-aberta { grid-template-rows: auto auto minmax(0, 1fr); }
    /* Insumos e emprestados são do painel; na aba VPS só atrapalham. Some sem
       mexer na posição do botão da VPS, que é ancorado pela direita. */
    .cp.vps-aberta .cp-so-painel { display: none; }
    .cp-vps-toolbar { gap: .4rem; }
    /* Única tela do painel que rola: é consulta de perto, não leitura de longe. */
    .cp-vps-corpo { min-height: 0; overflow-y: auto; padding-right: 4px; }
    .cp-vps-corpo { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .cp-vps-corpo::-webkit-scrollbar { width: 8px; }
    .cp-vps-corpo::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .cp-vps-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 20px; margin-bottom: 12px;
    }
    .cp-vps-card-topo {
      display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line);
      font-size: .9rem; font-weight: 700;   /* = .dash-panel-title do admin */
    }
    /* O SVG da Hostinger já vem roxo e funciona nos dois temas — sem filtro
       (inverter deixava ele amarelo). O do Docker é branco fixo: inverte no
       tema claro e volta ao normal no escuro, igual à aba VPS do admin. */
    .cp-vps-icone-docker { filter: invert(1); }
    html[data-theme="dark"] .cp-vps-icone-docker { filter: none; }
    /* Mesmo selo do .badge-status/.badge-ativo da aba VPS do admin: cores
       fixas (o fundo claro do selo não segue o tema lá, nem aqui). */
    .cp-vps-selo {
      margin-left: auto; display: inline-block;
      font-size: .72rem; font-weight: 700; letter-spacing: .5px;
      padding: .35em .7em; border-radius: 6px;
    }
    .cp-vps-selo.ok       { color: #1a7f4b; background: #e6f4ec; }
    .cp-vps-selo.erro     { color: #c0392b; background: #fdecea; }
    .cp-vps-selo.transicao{ color: #d68910; background: #fdf3e3; }
    /* Títulos de seção iguais aos <h3 class="h5"> da aba VPS do admin:
       corpo normal, não caixa-alta miúda como o resto do cockpit. */
    .cp-vps-sec {
      display: flex; align-items: center; gap: .5rem;
      font-size: 1.25rem; font-weight: 600; line-height: 1.2;
      color: var(--ink); margin: .7rem 0 .2rem;
    }
    .cp-vps-sec:first-of-type { margin-top: 0; }
    .cp-vps-sec img { width: 16px; height: 16px; }
    /* Controles da seção (faixa 24h/7d e select) ficam na linha de baixo, como no admin. */
    .cp-vps-ctrl { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
    /* Mesma grade e corpo do .vps-specs-grid do admin. */
    .cp-vps-specs {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: .35rem 1rem; font-size: .875rem;
    }
    .cp-vps-specs span { display: block; color: var(--muted); }
    .cp-vps-specs i { font-style: normal; }   /* <i> aqui é só âncora do valor */
    .cp-vps-graficos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .cp-vps-gtit {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: .8rem; color: var(--muted); margin-bottom: 4px;
    }
    .cp-vps-gtit b { font-size: .95rem; color: var(--ink-2); }
    /* Baixo de propósito: o Docker tem que caber embaixo sem rolar a tela. */
    .cp-vps-canvas { position: relative; height: 180px; }
    /* Mesmo chaveador da aba VPS do app (btn-group do Bootstrap com
       btn-outline-secondary): botões colados dividindo a borda, canto só nas
       pontas e o ativo em cinza cheio. Os valores são os que saem do app —
       aqui não há Bootstrap para herdar. */
    .cp-vps-faixa { display: flex; }
    .cp-vps-faixa button {
      background: transparent; border: 1px solid #cfcfcf; color: var(--ink);
      font-family: inherit; font-size: .875rem; font-weight: 600;
      padding: .25rem .5rem; cursor: pointer;
    }
    .cp-vps-faixa button + button { margin-left: -1px; }   /* uma borda só entre os dois */
    .cp-vps-faixa button:first-child { border-radius: 10px 0 0 10px; }
    .cp-vps-faixa button:last-child { border-radius: 0 10px 10px 0; }
    /* z-index: o ativo tem borda mais escura e precisa ficar por cima da do vizinho. */
    .cp-vps-faixa button.ativo {
      background: #6c757d; border-color: #6c757d; color: #fff; position: relative; z-index: 1;
    }
    .cp-vps-sub { color: var(--muted); font-size: .82rem; width: 100%; }
    .cp-vps-docker-btn {
      display: flex; align-items: center; gap: .55rem; width: 100%;
      background: none; border: 0; padding: .45rem 0; color: inherit;
      font-family: inherit; font-size: .92rem; font-weight: 600; cursor: pointer;
    }
    .cp-vps-docker-btn .cp-vps-chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
    .cp-vps-docker-btn[aria-expanded="true"] .cp-vps-chev { transform: rotate(180deg); }
    .cp-vps-docker-itens { padding: 0 0 .5rem 1.3rem; }
    .cp-vps-docker-itens[hidden] { display: none; }
    .cp-vps-cont { padding: .35rem 0; border-top: 1px solid var(--line); }
    .cp-vps-erro { color: var(--vermelho); font-size: .9rem; }
    .cp-vps-vazio { color: var(--muted); font-size: .9rem; }

    /* Telas pequenas não são o caso de uso, mas evita a grade colapsar feio. */
    @media (max-width: 900px) {
      .cp-linha { grid-template-columns: 1fr; }
      .cp { grid-template-rows: auto auto auto auto; height: auto; }
      .cp-vps-graficos { grid-template-columns: 1fr; }
      body { overflow: auto; }
    }
  </style>
</head>
<body>

  <div id="cpLogin" class="oculto">
    <form class="cp-login-card" id="cpFormLogin">
      <h1>GTI · COCKPIT</h1>
      <p>A sessão expirou. Entre novamente para retomar o painel.</p>
      <input type="text" id="cpEmail" placeholder="E-mail" autocomplete="username" required>
      <input type="password" id="cpSenha" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit" id="cpBtnEntrar">Entrar</button>
      <div class="cp-login-erro" id="cpLoginErro"></div>
    </form>
  </div>

  <div class="cp" id="cpApp">

    <!-- Cabeçalho -->
    <header class="cp-topo">
      <!-- A marca é o atalho para a Visão Geral do app, como o logo de um site
           leva para a home. -->
      <div class="cp-marca" data-app="ir=dashboard" title="Abrir o dashboard no app">
        <img src="favicon_intecs.png" alt="">
        GESTÃO TI
      </div>
      <div class="cp-mini" id="cpMini">
        <span class="cp-mini-item cp-so-painel" data-app="ir=insumos" title="Abrir no app"><i class="ph ph-package"></i><b id="cpInsumos">—</b> insumos</span>
        <span class="cp-mini-item cp-so-painel" data-app="ir=emprestimos" title="Abrir no app"><i class="ph ph-hand-arrow-up"></i><b id="cpEmprestados">—</b> emprestados</span>
        <!-- A barra vem ANTES do botão: o botão precisa continuar sendo o
             último item pra que a borda direita dele não se mexa ao abrir. -->
        <!-- Ícone e carimbo são um botão só: clicar no "atualizado às" também
             atualiza, que é o alvo maior e mais óbvio dos dois. -->
        <button type="button" class="cp-mini-item cp-mini-botao cp-vps-toolbar oculto" id="cpVpsBtnAtualizar" title="Atualizar">
          <i class="ph ph-arrow-clockwise"></i>
          <span class="cp-carimbo" id="cpVpsAtualizadoEm"></span>
        </button>
        <!-- Mesmo botão abre a aba VPS e volta dela: só o ícone vira seta, no
             lugar exato onde estava o da VPS. O texto (CPU/RAM) continua vivo,
             o que também mantém a largura — e a seta — parada no lugar. -->
        <button type="button" class="cp-mini-item cp-mini-botao" id="cpVpsItem" title="Ver detalhes da VPS"><i class="ph ph-hard-drives" id="cpVpsIcone"></i><b id="cpVpsEstado">—</b></button>
      </div>
      <div class="cp-relogio">
        <span class="cp-data" id="cpData">—</span>
        <span class="cp-hora" id="cpHora">--:--</span>
        <button class="cp-btn" id="cpBtnAviso" type="button" aria-label="Alternar avisos do Windows">
          <i class="ph ph-bell" id="cpIconeAviso"></i>
        </button>
        <button class="cp-btn" id="cpBtnSom" type="button" aria-label="Alternar som">
          <i class="ph ph-speaker-high" id="cpIconeSom"></i>
        </button>
        <button class="cp-btn" id="cpBtnTema" type="button" aria-label="Alternar tema">
          <i class="ph ph-sun" id="cpIconeTema"></i>
        </button>
        <button class="cp-btn" id="cpBtnTela" type="button" aria-label="Tela cheia" title="Tela cheia (F)">
          <i class="ph ph-corners-out" id="cpIconeTela"></i>
        </button>
      </div>
    </header>

    <!-- Linha 1: unidades, tela toda. Fica FORA do #cpPainel de propósito —
         a conexão das lojas continua à vista também na aba VPS. -->
    <section class="cp-bloco" id="blocoUnidades">
      <div class="cp-bloco-tit">
        <span class="cp-carimbo" id="cpUnidCarimbo"></span>
      </div>
      <div class="cp-corpo" id="cpUnidades" style="display:flex;flex-direction:column"></div>
    </section>

    <!-- display:contents — as linhas continuam sendo itens da grade .cp; o
         wrapper só existe pra esconder as de baixo de uma vez na aba VPS. -->
    <div id="cpPainel">

    <!-- Linha 2: chamados, tela toda -->
    <section class="cp-bloco" id="blocoChamados">
      <div class="cp-bloco-tit">
        <span data-app="ir=msa" title="Abrir no app"><i class="ph ph-headset"></i> Chamados</span>
        <span class="cp-carimbo" id="cpChamCarimbo"></span>
      </div>
      <div class="cp-corpo" id="cpChamados" style="display:flex;flex-direction:column"></div>
    </section>

    <!-- Linha 3: avisos + eventos -->
    <div class="cp-linha">
      <section class="cp-bloco" id="blocoAvisos">
        <div class="cp-bloco-tit">
          <!-- O nome do card leva à aba; o nome de cada aviso leva ao registro. -->
          <span data-app="ir=logs" title="Abrir no app"><i class="ph ph-shield-warning"></i> Avisos de segurança</span>
          <span class="cp-carimbo" id="cpAvisosCarimbo">últimos 7 dias</span>
        </div>
        <div class="cp-corpo"><div class="cp-lista" id="cpAvisos"></div></div>
      </section>

      <section class="cp-bloco" id="blocoEventos">
        <div class="cp-bloco-tit">
          <span data-app="ir=evento" title="Abrir no app"><i class="ph ph-calendar-dots"></i> Eventos do mês</span>
          <span class="cp-mes-nav">
            <button type="button" class="cp-mes-btn" id="cpMesAnt" aria-label="Mês anterior"><i class="ph ph-caret-left"></i></button>
            <span class="cp-carimbo" id="cpEventosCarimbo"></span>
            <button type="button" class="cp-mes-btn" id="cpMesProx" aria-label="Próximo mês"><i class="ph ph-caret-right"></i></button>
          </span>
        </div>
        <div class="cp-corpo"><div class="cp-lista" id="cpEventos"></div></div>
      </section>
    </div>

    </div><!-- /cpPainel -->

    <!-- Aba VPS: entra no lugar do painel, sob o mesmo cabeçalho. -->
    <div class="cp-vps-corpo oculto" id="cpVpsCards"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <script src="cockpit.js?v=6"></script>
</body>
</html>
