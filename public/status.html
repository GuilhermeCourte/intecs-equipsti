<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F3">
  <meta name="robots" content="noindex">
  <title>Serviços · Gestão TI</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gestaoti.intecsbr.org/status">
  <meta property="og:title" content="Serviços · Gestão TI">
  <meta property="og:description" content="Status dos serviços externos usados pela Intecs.">
  <meta property="og:image" content="https://gestaoti.intecsbr.org/icons/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/png" href="favicon_intecs.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    /* ============================================================
       Serviços no Downdetector — tela pública, sem login.
       Catálogo de atalhos: cada card abre o Downdetector do serviço.
       Não mostramos estado porque o servidor não consulta aquele site.

       Visual externo (mesma identidade de /chamados e /emails): tokens,
       topbar, toolbar/busca e rodapé são cópia da marcação dessas
       páginas — sem login/app aqui, então sem user-chip nem botão Sair.
       As páginas standalone deste projeto não compartilham folha de
       estilo, e abrir exceção aqui obrigaria a mexer no carregamento
       de todas.
       ============================================================ */
    :root {
      --primary:      #5B45E0;
      --primary-soft: #EEEBFA;
      --ring:         rgba(91, 69, 224, .18);
      --cta:          #D45C0D;
      --cta-hover:    #BC5109;
      --cta-shadow:   0 8px 24px -8px rgba(212, 92, 13, .35);

      --bg:           #F7F6F3;
      --surface:      #FFFFFF;
      --surface-2:    #FBFAF8;
      --ink:          #1C1917;
      --ink-2:        #44403C;
      --muted:        #78716C;
      --faint:        #A8A29E;
      --line:         #E7E5E0;
      --line-strong:  #D6D3CD;
      --danger-fg:    #B3261E;

      --font: 'Plus Jakarta Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;

      --shadow-sm:
        0px 2px 3px -1px rgba(0, 0, 0, 0.1),
        0px 1px 0px 0px rgba(25, 28, 33, 0.02),
        0px 0px 0px 1px rgba(25, 28, 33, 0.08);

      --r-btn: 8px; --r-md: 12px; --r-lg: 16px;
      --dur-micro: 150ms;
      --ease-out: cubic-bezier(.16, 1, .3, 1);

      /* Altura da topbar — de onde a toolbar gruda ao rolar. */
      --h-topbar: 55px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--font); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    i.ph { line-height: 1; }

    /* ============ Topbar ============ */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, .82);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      max-width: 960px; margin: 0 auto; padding: 10px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand .brand-mark { width: 28px; height: 28px; border-radius: 8px; box-shadow: var(--shadow-sm); flex: none; }
    .brand-name {
      font-size: .95rem; font-weight: 700; letter-spacing: -.01em;
      color: var(--ink); white-space: nowrap;
    }
    .brand-name .brand-dot { color: var(--faint); font-weight: 500; margin: 0 2px; }
    @media (max-width: 576px) {
      .brand .brand-mark { width: 24px; height: 24px; border-radius: 7px; }
      .brand-name { font-size: .88rem; }
    }

    /* ============ Página / molduras técnicas / hero ============ */
    .page { position: relative; max-width: 960px; margin: 0 auto; padding: 8px 20px 72px; }
    .page-foot {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      background: rgba(247, 246, 243, .88);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px max(20px, calc(50% - 460px));
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .page-foot img { height: 18px; width: auto; display: block; opacity: .75; }
    .page-foot span {
      font-family: var(--mono); font-size: .66rem; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
    }
    @media (min-width: 992px) {
      .page-corner { position: absolute; width: 4px; height: 4px; background: var(--line-strong); pointer-events: none; }
      .page-corner.tl { top: 0; left: 0; transform: translate(-50%, -50%); }
      .page-corner.tr { top: 0; right: 0; transform: translate(50%, -50%); }
    }
    @media (max-width: 991.98px) { .page-corner { display: none; } }

    .hero-row {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 16px; margin: 26px 0 20px; flex-wrap: wrap;
    }
    .hero-row h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -.02em; margin: 0; }
    .hero-sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
    @media (max-width: 576px) { .hero-row { flex-direction: column; align-items: stretch; margin-top: 20px; } }

    /* ============ Toolbar (busca) ============ */
    .toolbar {
      position: sticky; top: var(--h-topbar); z-index: 80;
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      margin: 0 0 20px; padding: 10px 0;
      background: rgba(247, 246, 243, .9);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .search-box { flex: 1 1 240px; position: relative; min-width: 200px; }
    .search-box > i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--faint); font-size: 17px; pointer-events: none;
    }
    .search-box input {
      width: 100%; height: 44px; border: 1px solid var(--line-strong); border-radius: var(--r-md);
      background: var(--surface); padding: 0 44px 0 42px; font-size: 16px; color: var(--ink);
      outline: 0; transition: border-color var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
    }
    .search-box input::placeholder { color: var(--faint); }
    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--ring); }
    .search-box input::-webkit-search-cancel-button { display: none; }

    /* ============ Cards de serviço ============ */
    .sv-grid { display: grid; gap: 1rem; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 991.98px) { .sv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 575.98px) { .sv-grid { grid-template-columns: 1fr; } }

    /* O card inteiro é o link: alvo de toque grande no celular. */
    .sv-card {
      display: flex; flex-direction: column; gap: .15rem;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r-lg); box-shadow: var(--shadow-sm); padding: 1.25rem;
      text-decoration: none; color: inherit; min-width: 0;
      transition: border-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
    }
    @media (hover: hover) {
      .sv-card:hover { border-color: var(--cta); transform: translateY(-2px); box-shadow: var(--shadow-sm), var(--cta-shadow); }
      .sv-card:hover .sv-cta { color: var(--cta); }
    }
    .sv-card:active { transform: scale(.99); }
    .sv-nome {
      font-weight: 700; font-size: 1.1rem; letter-spacing: -.01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sv-slug { color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sv-cta {
      color: var(--muted); font-size: .82rem; font-weight: 600; margin-top: .6rem;
      display: inline-flex; align-items: center; gap: .35rem;
      transition: color var(--dur-micro) var(--ease-out);
    }
    .vazio, .erro { color: var(--muted); grid-column: 1 / -1; font-size: .9rem; }
    .erro { color: var(--danger-fg); }

    .rodape-nota { color: var(--muted); font-size: .82rem; margin: 1.25rem 0 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="favicon_emails.png" alt="" class="brand-mark">
        <span class="brand-name">GTI <span class="brand-dot">·</span> Serviços</span>
      </div>
    </div>
  </header>

  <main class="page">
    <span class="page-corner tl" aria-hidden="true"></span>
    <span class="page-corner tr" aria-hidden="true"></span>

    <section class="hero-row">
      <div>
        <h1>Serviços</h1>
        <div class="hero-sub">Os serviços que a operação utiliza. Clique para ver as falhas relatadas agora.</div>
      </div>
    </section>

    <section class="toolbar">
      <div class="search-box">
        <i class="ph ph-magnifying-glass"></i>
        <input type="search" id="busca" placeholder="Buscar serviço..." aria-label="Buscar serviço">
      </div>
    </section>

    <div class="sv-grid" id="grid"></div>

    <p class="rodape-nota">Os gráficos de falhas ficam no Downdetector — cada card abre a página do serviço.</p>

    <footer class="page-foot">
      <img src="logo_intecs_cor.png" alt="Intecs">
      <span>Suporte interno de TI</span>
    </footer>
  </main>

  <script src="status.js"></script>
</body>
</html>
