# ============================================================
#  Gestão TI — VPS
# ============================================================
# O banco NÃO está aqui: continua no SQL Server externo apontado pelo .env
# (DB_HOST). Este compose sobe só a aplicação.
#
# Uso:
#   docker compose up -d --build
#   docker compose logs -f
services:
  app:
    build: .
    image: gestaoti:latest
    container_name: gestaoti
    restart: unless-stopped

    # ATENÇÃO: uma instância só. Não usar "replicas", nem PM2 cluster, nem
    # subir uma segunda cópia contra o mesmo domínio. Há estado em memória:
    #   - challenges do WebAuthn (server/webauthn.js) -> biometria falharia
    #     de forma intermitente;
    #   - cookie de sessão do eurosa (server/index.js) -> logins em disputa;
    #   - lock do sync do Google Drive (server/googleworkspace/service.js);
    #   - timers de lembrete do calendário -> e-mail duplicado.

    # Sem env_file: o editor de compose do Gerenciador Docker (Hostinger) não
    # processa essa chave (referencia um arquivo que o painel não enxerga).
    # As variáveis do .env vão coladas em bloco na seção "Ambiente" do painel,
    # que injeta no container por fora do YAML.

    # Só no loopback: quem publica na internet é o nginx do host.
    ports:
      - "127.0.0.1:3000:3000"

    # fetch nativo do Node 22 — evita instalar curl na imagem só para isto.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

    # Sem volumes: a aplicação não escreve nada em disco.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
