# ============================================================
#  nginx — gestaoti.intecsbr.org
# ============================================================
# Roda no host (não em container). Instalação:
#   cp nginx/gestaoti.conf /etc/nginx/sites-available/gestaoti
#   ln -s /etc/nginx/sites-available/gestaoti /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d gestaoti.intecsbr.org
#
# O certbot acrescenta sozinho o bloco 443, o ssl_certificate e o redirect
# de 80 -> 443, e instala o timer de renovação. Por isso este arquivo começa
# só com o :80.

upstream gestaoti_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name gestaoti.intecsbr.org;

    # Um registro do inventário vai com até 3 fotos base64 no mesmo corpo.
    # Mantido em sincronia com o express.json({ limit }) de server/index.js:
    # se um dos dois for menor, o upload de fotos quebra com 413.
    client_max_body_size 15m;

    # O compression() do Express já comprime as respostas; não recomprimir.
    gzip off;

    access_log /var/log/nginx/gestaoti.access.log;
    error_log  /var/log/nginx/gestaoti.error.log;

    location / {
        proxy_pass http://gestaoti_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SOBRESCREVE, não anexa. Com $proxy_add_x_forwarded_for o cliente
        # consegue plantar o primeiro item da lista, e é exatamente o primeiro
        # item que a detecção de máquina do chamado lê
        # (server/index.js, /api/chamados-intecs/verificar-maquina).
        proxy_set_header X-Forwarded-For   $remote_addr;

        # runScript do Tactical RMM espera o script rodar no agente:
        # 90s de timeout + folga. Era o que estourava o limite da Vercel.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # ---------- Cache dos estáticos ----------
    # O express.static já manda ETag/Last-Modified, então revisitas hoje já
    # respondem 304 sem reenviar o corpo. O ganho aqui é eliminar o
    # round-trip das imagens, que são os bytes pesados (logo_intecs3.png tem
    # 568 KB).
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        proxy_pass http://gestaoti_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # O express.static manda "Cache-Control: public, max-age=0". Sem o
        # proxy_hide_header o add_header ANEXA um segundo Cache-Control, e o
        # navegador obedece o primeiro max-age que encontra (0) — o cache de
        # 30 dias simplesmente não valeria.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
    }

    # app.js e chamados.js NÃO têm hash no nome: um max-age longo entregaria
    # front-end velho depois do deploy. no-cache aqui significa "revalide
    # sempre" (o 304 continua barato), não "não guarde".
    location ~* \.(js|css)$ {
        proxy_pass http://gestaoti_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
    }

    # O service worker é network-first e controla o cache do app inteiro:
    # se ele mesmo ficar cacheado, o app trava numa versão antiga.
    location = /service-worker.js {
        proxy_pass http://gestaoti_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Nunca cachear as respostas da API (são autenticadas).
    location /api/ {
        proxy_pass http://gestaoti_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;

        proxy_read_timeout 150s;
        proxy_send_timeout 150s;

        add_header Cache-Control "no-store";
    }
}
